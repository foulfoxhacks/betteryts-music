[package]
name = "betteryts-music-desktop"
version = "0.10.0"
edition = "2021"
description = "BetterYTS Music for Linux and Windows"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
betteryts_core = { path = "../../core" }
tauri = { version = "2", features = [] }
tauri-plugin-localhost = "2"
serde_json = "1"
# Media keys and the OS "now playing" panel: MPRIS on Linux, SMTC (taskbar/lock screen) on Windows.
souvlaki = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
