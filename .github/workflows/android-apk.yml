name: Android APK Builds

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BetterYTS Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Test Rust core
        working-directory: core
        run: cargo test --locked

      - name: Build Rust core for Android
        working-directory: core
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 26 -o ../android/app/src/main/jniLibs build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build sideload and Play Store debug APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleSideloadDebug assemblePlayDebug

      - name: Calculate APK checksums
        shell: bash
        run: |
          cd android/app/build/outputs/apk
          find sideload/debug play/debug -name "*.apk" -type f -print0 | sort -z | xargs -0 sha256sum | tee "$GITHUB_WORKSPACE/apk-sha256.txt"

      - name: Upload APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: betteryts-android-apks-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/sideload/debug/*.apk
            android/app/build/outputs/apk/play/debug/*.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## BetterYTS Android build"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Rust core tests and Android APK build are required for a successful run."
            echo "- Expected APKs: sideload debug and Play Store debug."
            if [ -f apk-sha256.txt ]; then
              echo ""
              echo "### SHA-256"
              echo '```text'
              cat apk-sha256.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
