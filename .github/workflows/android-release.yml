name: Release (Android, Linux, Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new release tag (for example v0.9.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BTM_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BTM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BTM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BTM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more BTM release-signing secrets. See the README release-signing instructions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Test Rust core
        working-directory: core
        run: cargo test --locked

      - name: Build Rust core for Android
        working-directory: core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 26 -o ../android/app/src/main/jniLibs build --release

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build signed sideload APK and Play bundle
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleSideloadRelease :app:bundlePlayRelease

      - name: Verify APK signature
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/sideload/release/app-sideload-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/sideload/release/*.apk release-assets/
          cp android/app/build/outputs/bundle/playRelease/*.aab release-assets/
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          printf 'Release tag: %s\nCommit: %s\n' "${{ inputs.tag || github.ref_name }}" "$GITHUB_SHA" > release-assets/BUILD-INFO.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: BetterYTS Music ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
            release-assets/BUILD-INFO.txt

  desktop:
    name: Build ${{ matrix.name }} packages
    strategy:
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - name: Install WebKitGTK and build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build desktop packages
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # After the Android job has created the release, add the desktop packages to it.
  desktop-publish:
    name: Add desktop packages to the release
    needs: [release, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Desktop checksums
        run: |
          cd dist
          sha256sum *.deb *.AppImage *.msi *.exe | tee DESKTOP-SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/*.msi
            dist/*.exe
            dist/DESKTOP-SHA256SUMS.txt
