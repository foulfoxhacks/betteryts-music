name: Build Android, Linux and Windows

# Every push (any branch), pull request and manual run builds all three platforms.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Test Rust core
        working-directory: core
        run: cargo test --locked

  android:
    name: Android (sideload + Play)
    needs: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails on cmdline-tools 16+; the next step installs what's needed.
          packages: ""
      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build Rust core for Android
        working-directory: core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 26 -o ../android/app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v5
      - name: Build sideload and Play Store debug APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleSideloadDebug assemblePlayDebug
      # Every build of main is also published as a release: signed APK and Play bundle.
      - name: Restore release signing key (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BTM_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BTM_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BTM_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BTM_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more BTM release-signing secrets. See the README release-signing instructions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build signed sideload APK and Play bundle (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleSideloadRelease :app:bundlePlayRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/sideload/release/app-sideload-release.apk
          rm -f keystore.properties
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: betteryts-android-signed-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/sideload/release/*.apk
            android/app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Checksums
        shell: bash
        run: |
          cd android/app/build/outputs/apk
          find sideload/debug play/debug -name "*.apk" -type f -print0 | sort -z | xargs -0 sha256sum | tee "$GITHUB_WORKSPACE/apk-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: betteryts-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/sideload/debug/*.apk
            android/app/build/outputs/apk/play/debug/*.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux (.deb, AppImage)
    needs: core-tests
    # The oldest supported runner, so the packages run on older distributions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install WebKitGTK and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build desktop packages
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build
      - name: Checksums
        shell: bash
        run: |
          cd desktop/src-tauri/target/release/bundle
          find deb appimage -type f \( -name "*.deb" -o -name "*.AppImage" \) -print0 | xargs -0 sha256sum | tee "$GITHUB_WORKSPACE/linux-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: betteryts-linux-${{ github.run_number }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            linux-sha256.txt
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (.msi, setup.exe)
    needs: core-tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build desktop installers
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem desktop/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe |
            Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Tee-Object -FilePath windows-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: betteryts-windows-${{ github.run_number }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            windows-sha256.txt
          if-no-files-found: error
          retention-days: 30

  # Every push to main becomes the latest GitHub Release (signed Android + desktop packages).
  publish:
    name: Publish as the latest release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: betteryts-*
          merge-multiple: true
      - name: Collect release files
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find dl -type f \( -name 'app-sideload-release.apk' -o -name '*.aab' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} dist/ \;
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          version=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          printf 'Version: %s\nBuild: %s\nCommit: %s\n' "$version" "${{ github.run_number }}" "$GITHUB_SHA" > dist/BUILD-INFO.txt
          echo "tag=v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=BetterYTS Music ${version} (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.deb
            dist/*.AppImage
            dist/*.msi
            dist/*.exe
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
